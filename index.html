<script type="module">
import * as THREE from 'three';

import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const rand = (a, b) => a + Math.random() * (b - a);
const ss = (e0, e1, x) => { const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;

// ===================== Renderer / Scene
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// ===================== Course & path
const COURSE = 3370;
const speedAt = (z) => 30 + 52*ss(2150,2780,z); // accelerates as he heads into deep space
const BH_Z = 3150; // black-hole climax begins here (journey freezes for the finale)
const ALT = [[0,50],[260,50],[360,28],[640,28],[720,13],[960,13],[1020,30],[1160,30],[1220,16],[1460,16],[1540,22],[1820,22],[1900,40],[1980,56],[2150,62],[3150,66],[3370,52]];
function altitudeAt(z){ for(let i=0;i<ALT.length-1;i++){const[z0,y0]=ALT[i],[z1,y1]=ALT[i+1]; if(z>=z0&&z<=z1) return lerp(y0,y1,ss(z0,z1,z));} return ALT[ALT.length-1][1]; }
function lateralAt(z){ return Math.sin(z*0.011)*6 + Math.sin(z*0.027)*2.2; }
// keep a clear flight corridor: solids must stay this far (plus their radius) from the path
function pathClear(x, z, R, base=6){ return Math.abs(x - lateralAt(z)) > (base + R); }

const ACTS = [

  { z:0,    top:C(0x2b3a6b), mid:C(0xc97a8a), bot:C(0xffb877), light:C(0xffd9b0), lightI:1.7, hemiI:0.62, fog:C(0xe6b89a), fogD:0.0030, sunCol:C(0xffd9b0), sunElev:0.10, sunSize:26, night:0.0 },
  { z:380,  top:C(0x3a6ea5), mid:C(0x9fc0e0), bot:C(0xeaf2fa), light:C(0xfff2da), lightI:2.6, hemiI:0.85, fog:C(0xcfdcea), fogD:0.0024, sunCol:C(0xfff2da), sunElev:0.36, sunSize:22, night:0.0 },
  { z:820,  top:C(0x2f6fb0), mid:C(0xaad0ec), bot:C(0xeaf4ff), light:C(0xffffff), lightI:3.0, hemiI:0.95, fog:C(0xd6e6f2), fogD:0.0021, sunCol:C(0xffffff), sunElev:0.62, sunSize:20, night:0.0 },
  { z:1300, top:C(0x4a6f93), mid:C(0x9fb0c0), bot:C(0xc4ccd4), light:C(0xeae6d8), lightI:1.7, hemiI:0.72, fog:C(0xb4bec6), fogD:0.0034, sunCol:C(0xeae6d8), sunElev:0.46, sunSize:20, night:0.0 },
  { z:1660, top:C(0x3a5a8a), mid:C(0xe0a060), bot:C(0xffce7a), light:C(0xffd28a), lightI:2.7, hemiI:0.72, fog:C(0xf0c594), fogD:0.0022, sunCol:C(0xffd28a), sunElev:0.22, sunSize:30, night:0.0 },
  { z:1900, top:C(0x27285c), mid:C(0xd0685a), bot:C(0xff9a5a), light:C(0xff8a5a), lightI:1.5, hemiI:0.52, fog:C(0xc4796a), fogD:0.0028, sunCol:C(0xff7a4a), sunElev:0.05, sunSize:38, night:0.18 },
  { z:2050, top:C(0x05030f), mid:C(0x0c1430), bot:C(0x161e44), light:C(0x9fb4e0), lightI:0.55,hemiI:0.34, fog:C(0x070b1e), fogD:0.0020, sunCol:C(0x223052), sunElev:-0.25,sunSize:16, night:1.0 },
  { z:2150, top:C(0x05030f), mid:C(0x0c1430), bot:C(0x161e44), light:C(0x9fb4e0), lightI:0.55,hemiI:0.34, fog:C(0x070b1e), fogD:0.0020, sunCol:C(0x223052), sunElev:-0.25,sunSize:16, night:1.0 },
  { z:2300, top:C(0x02030a), mid:C(0x04060f), bot:C(0x070914), light:C(0x8fa6d6), lightI:0.55,hemiI:0.30, fog:C(0x01020a), fogD:0.0065, sunCol:C(0x223052), sunElev:-0.3, sunSize:14, night:1.0 },
  { z:3370, top:C(0x010208), mid:C(0x03040c), bot:C(0x05060f), light:C(0x8fa6d6), lightI:0.55,hemiI:0.28, fog:C(0x01010a), fogD:0.0065, sunCol:C(0x223052), sunElev:-0.3, sunSize:14, night:1.0 },
];
const tod = { top:C(0), mid:C(0), bot:C(0), light:C(0), lightI:2, hemiI:0.8, fog:C(0), fogD:0.0024, sunCol:C(0), sunElev:0.4, sunSize:22, night:0 };
function todAt(z){
  let a = TOD[0], b = TOD[TOD.length-1];
  for(let i=0;i<TOD.length-1;i++){ if(z>=TOD[i].z && z<=TOD[i+1].z){ a=TOD[i]; b=TOD[i+1]; break; } }
  const t = ss(a.z, b.z, z);
  tod.top.copy(a.top).lerp(b.top,t); tod.mid.copy(a.mid).lerp(b.mid,t); tod.bot.copy(a.bot).lerp(b.bot,t);
  tod.light.copy(a.light).lerp(b.light,t); tod.fog.copy(a.fog).lerp(b.fog,t); tod.sunCol.copy(a.sunCol).lerp(b.sunCol,t);
  tod.lightI=lerp(a.lightI,b.lightI,t); tod.hemiI=lerp(a.hemiI,b.hemiI,t); tod.fogD=lerp(a.fogD,b.fogD,t);
  tod.sunElev=lerp(a.sunElev,b.sunElev,t); tod.sunSize=lerp(a.sunSize,b.sunSize,t); tod.night=lerp(a.night,b.night,t);
  return tod;
}

// ===================== Sky dome (gradient shader, rides with camera)
const skyRig = new THREE.Group(); scene.add(skyRig);
const skyU = { top:{value:C(0x3a6ea5)}, mid:{value:C(0x9fc0e0)}, bot:{value:C(0xeaf2fa)} };
const skyMat = new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite:false, fog:false, uniforms: skyU,
  vertexShader:`varying vec3 vD; void main(){ vD=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`varying vec3 vD; uniform vec3 top; uniform vec3 mid; uniform vec3 bot; void main(){ float h=clamp(vD.y*0.5+0.5,0.0,1.0); vec3 c=mix(bot,mid,smoothstep(0.0,0.5,h)); c=mix(c,top,smoothstep(0.5,1.0,h)); gl_FragColor=vec4(c,1.0); }` });
skyRig.add(new THREE.Mesh(new THREE.SphereGeometry(900, 32, 16), skyMat));

// Sun + glow + Moon
const sun = new THREE.Mesh(new THREE.SphereGeometry(1,24,18), new THREE.MeshBasicMaterial({ color:0xfff3d0, fog:false })); skyRig.add(sun);
const sunGlow = new THREE.Mesh(new THREE.SphereGeometry(1,24,18), new THREE.MeshBasicMaterial({ color:0xffe6a8, transparent:true, opacity:0.25, fog:false })); skyRig.add(sunGlow);
const moon = new THREE.Mesh(new THREE.SphereGeometry(34,32,24), new THREE.MeshBasicMaterial({ color:0xfff6e2, fog:false })); moon.renderOrder=3; moon.visible=false; skyRig.add(moon);
const moonGlow = new THREE.Mesh(new THREE.SphereGeometry(64,28,22), new THREE.MeshBasicMaterial({ color:0x9fb6ff, fog:false, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false })); skyRig.add(moonGlow);
const moonDir = new THREE.Vector3(0.5,0.32,0.6).normalize();
moon.position.copy(moonDir).multiplyScalar(760); moonGlow.position.copy(moon.position);

// Stars + Milky Way (points, ride with camera, fade in at night)
function makeGalaxy(){
  const N = 6000, pos = new Float32Array(N*3), col = new Float32Array(N*3), siz = new Float32Array(N);
  const bn = new THREE.Vector3(0.92,0.32,0.12).normalize(); // band normal (arches across the forward view)
  const u = new THREE.Vector3(0,1,0).cross(bn).normalize(); const v = new THREE.Vector3().crossVectors(bn,u);
  const cBand = [C(0xfff3e0), C(0xcfe0ff), C(0xffd9e6), C(0xe8dcff)];
  for(let i=0;i<N;i++){
    const band = Math.random() < 0.62;
    let dir;
    if(band){ const ang = rand(0,6.283); const lat = (Math.random()-0.5)*(Math.random()-0.5)*1.6; // concentrate near band plane
      dir = new THREE.Vector3().addScaledVector(u,Math.cos(ang)).addScaledVector(v,Math.sin(ang)).addScaledVector(bn,lat).normalize();
    } else { dir = new THREE.Vector3(rand(-1,1),rand(-1,1),rand(-1,1)).normalize(); }
    dir.multiplyScalar(850);
    pos[i*3]=dir.x; pos[i*3+1]=dir.y; pos[i*3+2]=dir.z;
    const c = band ? cBand[(Math.random()*cBand.length)|0].clone() : C(0xffffff);
    const b = band ? rand(0.5,1) : rand(0.6,1); c.multiplyScalar(b);
    col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
    siz[i] = band ? rand(1.4,4.5) : rand(1,2.4);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.BufferAttribute(col,3));
  g.setAttribute('asize', new THREE.BufferAttribute(siz,1));
  const m = new THREE.PointsMaterial({ size:4.0, map:softDot(), vertexColors:true, transparent:true, opacity:0, depthWrite:false, blending:THREE.AdditiveBlending, fog:false, sizeAttenuation:false });
  return new THREE.Points(g,m);
}
function makeNebula(){
  const N = 160, pos = new Float32Array(N*3), col = new Float32Array(N*3);
  const bn = new THREE.Vector3(0.92,0.32,0.12).normalize(); const u = new THREE.Vector3(0,1,0).cross(bn).normalize(); const v = new THREE.Vector3().crossVectors(bn,u);
  const tints = [C(0x6a5acd), C(0x4a6fd0), C(0xc06a9a), C(0x8a6ad0), C(0x5ad0c0)];
  for(let i=0;i<N;i++){ const ang=rand(0,6.283); const lat=(Math.random()-0.5)*0.55;
    const dir=new THREE.Vector3().addScaledVector(u,Math.cos(ang)).addScaledVector(v,Math.sin(ang)).addScaledVector(bn,lat).normalize().multiplyScalar(840);
    pos[i*3]=dir.x; pos[i*3+1]=dir.y; pos[i*3+2]=dir.z;
    const c=tints[(Math.random()*tints.length)|0].clone().multiplyScalar(rand(0.25,0.6)); col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b; }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.setAttribute('color',new THREE.BufferAttribute(col,3));
  const m=new THREE.PointsMaterial({ size:105, map:softDot(), vertexColors:true, transparent:true, opacity:0, depthWrite:false, blending:THREE.AdditiveBlending, fog:false, sizeAttenuation:true });
  return new THREE.Points(g,m);
}
function softDot(){ const c=document.createElement('canvas'); c.width=c.height=32; const x=c.getContext('2d'); const g=x.createRadialGradient(16,16,0,16,16,16); g.addColorStop(0,'#fff'); g.addColorStop(0.4,'rgba(255,255,255,0.6)'); g.addColorStop(1,'rgba(255,255,255,0)'); x.fillStyle=g; x.fillRect(0,0,32,32); return new THREE.CanvasTexture(c); }
function streakTex(){ const c=document.createElement('canvas'); c.width=16; c.height=64; const x=c.getContext('2d'); const g=x.createLinearGradient(0,0,0,64); g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(0.5,'rgba(220,235,255,0.9)'); g.addColorStop(1,'rgba(255,255,255,0)'); x.fillStyle=g; x.fillRect(6,0,4,64); return new THREE.CanvasTexture(c); }
const galaxy = makeGalaxy(); skyRig.add(galaxy);
const nebula = makeNebula(); skyRig.add(nebula);

// ===================== Lights
const key = new THREE.DirectionalLight(0xfff0d6, 2.6); key.castShadow = true;
key.shadow.mapSize.set(2048,2048); key.shadow.camera.near=1; key.shadow.camera.far=160;
Object.assign(key.shadow.camera,{left:-30,right:30,top:30,bottom:-30}); key.shadow.bias=-0.0004; key.shadow.normalBias=0.05;
scene.add(key, key.target);
const hemi = new THREE.HemisphereLight(0xbcd4ff, 0x55502f, 0.85); scene.add(hemi);
const lightDir = new THREE.Vector3(-0.35,0.66,0.5).normalize();

// ===================== Helpers
const dummy = new THREE.Object3D();
function craggy(geo, amt){ const p=geo.attributes.position; for(let i=0;i<p.count;i++){ const x=p.getX(i),y=p.getY(i),z=p.getZ(i); const n=Math.sin(x*1.7+y*0.6)*Math.cos(z*1.6-y*0.4); const r=Math.hypot(x,z)||1; p.setX(i,x+(x/r)*n*amt); p.setZ(i,z+(z/r)*n*amt);} geo.computeVertexNormals(); return geo; }

// ===================== Green terrain (lakes + snowy pass + forest)
const lakes = [ {x:-8,z:830,r:46},{x:30,z:940,r:40},{x:-26,z:1050,r:34} ];
function terrainHeight(x,z){ let h = 2.2 + Math.sin(x*0.03)*3 + Math.cos(z*0.026)*3 + Math.sin((x+z)*0.05)*1.6 + Math.cos(x*0.012-z*0.02)*2.5;
  for(const L of lakes){ const d=Math.hypot(x-L.x,z-L.z); h -= Math.exp(-(d*d)/(2*(L.r*0.6)**2))*9; } return h; }
const GZ0=660, GZ1=1520;
{
  const W=640, D=GZ1-GZ0, geo=new THREE.PlaneGeometry(W,D,150,210); geo.rotateX(-Math.PI/2);
  const cz=(GZ0+GZ1)/2, p=geo.attributes.position, col=[];
  const cGrass=C(0x4f7a3a),cForest=C(0x2f5a2c),cRock=C(0x7d7363),cSand=C(0xbcae84),cSnow=C(0xeef3fb);
  for(let i=0;i<p.count;i++){ const x=p.getX(i), z=p.getZ(i)+cz, h=terrainHeight(x,z); p.setY(i,h);
    const c=new THREE.Color(); if(h<1.0)c.copy(cSand); else if(h<5)c.copy(cGrass).lerp(cForest, ss(1,5,h)*(z>1180?0.85:0.3)); else c.copy(cForest).lerp(cRock, ss(6,11,h));
    const snowy = ss(985,1030,z)*(1-ss(1165,1205,z)); if(snowy>0) c.lerp(cSnow, snowy*(0.55+ss(1,6,h)*0.45));
    col.push(c.r,c.g,c.b);

// Camera: mostly a steady, free-view-like follow (behind, gently swaying), with the occasional
// slow rotation around Pippin at key moments, and a single subtle face zoom as he enters space.
function updateOrbitCamera(dt){
  const h=carpet.rotation.y;
  const fcY=faceLocal.y>0.5?faceLocal.y:2.0;
  const focusY=lerp(fcY-0.5, fcY, cl);
  const fx=carpet.position.x, fy=carpet.position.y+focusY, fz=carpet.position.z;
  // base: steady behind with a very gentle sway
  let az=Math.sin(t*0.03)*0.18;
  // occasional gentle swing out to a side profile and back (shows the scene from a new angle; same distance)
  if(cl<0.08){
    if(orbActive){ orbT+=dt; const op=orbT/orbDur; if(op>=1){ orbActive=false; orbNext=rand(26,42); } else { az += Math.sin(op*Math.PI)*orbAmt; } }
    else { orbNext-=dt; if(orbNext<=0 && phase==='flight'){ orbActive=true; orbT=0; orbDur=rand(10,14); orbAmt=(Math.random()<0.5?1:-1)*rand(0.9,1.3); } }
  }
  // single subtle zoom toward a front-3/4 of his face as he enters space (cl is driven by z)
  az=lerp(az, Math.PI-0.5, ss(0.04,0.5,cl));
  const el=lerp(0.18 + Math.sin(t*0.024)*0.05, 0.12, cl);
  const dist=lerp(16.5 + Math.sin(t*0.02)*0.9, 5.6, cl);        // base pulled back so the landscapes read; zoom only a little closer
  const fov=lerp(50,43,cl);
  const ce=Math.cos(el),se=Math.sin(el),sa=Math.sin(az),ca=Math.cos(az);
  const lx=ce*sa*dist, ly=se*dist, lz=-ce*ca*dist;             // az=0 → behind; az=π → in front (face)
  dPos.set(Math.cos(h)*lx+Math.sin(h)*lz, ly, -Math.sin(h)*lx+Math.cos(h)*lz);
  if(!camInit){ camOff.copy(dPos); camInit=true; } else camOff.lerp(dPos, 1-Math.pow(0.05,dt));
  camera.position.set(fx+camOff.x, fy+camOff.y, fz+camOff.z);
  camera.lookAt(fx,fy,fz);
  camera.fov += (fov-camera.fov)*Math.min(1,dt*1.6); camera.updateProjectionMatrix();
}

function updateRider(dt){
  if(phase==='flight'){ emNext-=dt; if(emNext<=0 && !emName){ playEmote(pickActEmote()); const calm=(curAct===0||curAct===2||curAct>=6); emNext=calm?rand(30,52):rand(22,40); } }
  let py=Math.sin(t*2.2)*0.04, rx=0, ry=0, rz=Math.sin(t*1.5)*0.04, sx=1, sy=1, sz=1;
  if(emName){ emT+=dt; const p=Math.min(1,emT/emDur);
    if(emName==='hop'){ const hh=Math.sin(p*Math.PI); py+=hh*0.9; const sq=Math.sin(p*Math.PI*2)*0.10; sy+=sq; sx-=sq*0.5; sz-=sq*0.5; }
    else if(emName==='spin'){ ry+=p*Math.PI*2; py+=Math.sin(p*Math.PI)*0.35; }
    else if(emName==='dance'){ rz+=Math.sin(p*Math.PI*6)*0.26; py+=Math.abs(Math.sin(p*Math.PI*6))*0.18; }
    else if(emName==='nod'){ rx+=Math.sin(p*Math.PI*3)*0.28; }
    else if(emName==='cheer'){ py+=Math.abs(Math.sin(p*Math.PI*2))*0.7; rx-=Math.sin(p*Math.PI)*0.18; }
    else if(emName==='wave'){ rz+=Math.sin(p*Math.PI*4)*0.22; rx-=0.06; }

    else if(emName==='shiver'){ const q=Math.sin(p*Math.PI); rz+=Math.sin(t*42)*0.05*q; rx+=Math.sin(t*38)*0.04*q; py-=0.05*q; sy-=0.04*q; } // brr
    else if(emName==='peek'){ const q=Math.sin(p*Math.PI); rx+=q*0.30; py-=q*0.06; } // leans down to look

const PENTA=[523.25,587.33,659.25,783.99,880.00, 1046.5,1174.7]; // C5..D6
// per-act mood: [pad lowpass Hz, bell density, melody octave]
const MUSIC_MOOD=[ [620,0.42,1], [950,0.50,1], [1300,0.55,1], [780,0.40,1], [1150,0.64,1], [1500,0.56,1], [470,0.40,2],
  [430,0.42,2], [560,0.50,2], [600,0.48,2], [640,0.52,2], [320,0.30,2] ]; // 7 beyond, 8 worlds, 9 asteroids, 10 spiral, 11 event horizon
function initAudio(){ if(audio) return; const Ctx=window.AudioContext||window.webkitAudioContext; if(!Ctx) return; const ctx=new Ctx();
  const master=ctx.createGain(); master.gain.value=0; master.connect(ctx.destination);
  const dl=ctx.createDelay(0.6); dl.delayTime.value=0.34; const fb=ctx.createGain(); fb.gain.value=0.32; const wet=ctx.createGain(); wet.gain.value=0.26; dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(master);
  const padGain=ctx.createGain(); padGain.gain.value=0; const padF=ctx.createBiquadFilter(); padF.type='lowpass'; padF.frequency.value=850; padGain.connect(padF); padF.connect(master); padF.connect(dl);
  const pads=[]; for(let i=0;i<3;i++){ const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=CHORDS[0][i]; const g=ctx.createGain(); g.gain.value=0.10; o.connect(g); g.connect(padGain); o.start(); pads.push(o); }
  padGain.gain.linearRampToValueAtTime(0.5, ctx.currentTime+4);
  master.gain.linearRampToValueAtTime(0.55, ctx.currentTime+3);
  audio={ctx,master,dl,pads,padGain,padF, next:ctx.currentTime+0.2, step:0, bellProb:0.5, octave:1};
  scheduler();
}
function bell(time,freq,vel){ const ctx=audio.ctx; const o=ctx.createOscillator(); o.type='triangle'; o.frequency.value=freq; const g=ctx.createGain(); g.gain.setValueAtTime(0,time); g.gain.linearRampToValueAtTime(vel,time+0.01); g.gain.exponentialRampToValueAtTime(0.001,time+1.5); o.connect(g); g.connect(audio.master); g.connect(audio.dl); o.start(time); o.stop(time+1.6); }
function scheduler(){ if(!audio) return; const ctx=audio.ctx;
  while(audio.next < ctx.currentTime+0.3){ const s=audio.step, time=audio.next;
    if(s%16===0){ const ch=CHORDS[(s/16)%CHORDS.length]; audio.pads.forEach((o,i)=>o.frequency.linearRampToValueAtTime(ch[i], time+0.6)); }
    if(s%2===0 && Math.random()<audio.bellProb){ const ch=CHORDS[Math.floor(s/16)%CHORDS.length]; const f=PENTA[(Math.random()*PENTA.length)|0]*audio.octave; bell(time, f, 0.15); if(Math.random()<0.3) bell(time+0.001, ch[0]*4, 0.05); }
    audio.next+=0.3; audio.step++;
  }
  setTimeout(scheduler,70);
}
function toggleMusic(){ if(!audio) return; musicOn=!musicOn; audio.master.gain.linearRampToValueAtTime(musicOn?0.55:0.0, audio.ctx.currentTime+0.4); const b=document.getElementById('mute'); b.textContent=musicOn?'♪':'✕'; }

// ---- Begin / input ----
function begin(){ const s=document.getElementById('start'); if(!s.classList.contains('show')) return; s.classList.remove('show'); phase='intro'; introT=0; initAudio(); if(audio&&audio.ctx.state==='suspended') audio.ctx.resume(); setTimeout(()=>hintEl.style.opacity='',6000); if(REC) setTimeout(startRec,300); }
document.getElementById('start').addEventListener('click', begin);
document.getElementById('mute').addEventListener('click', e=>{ e.stopPropagation(); toggleMusic(); });
addEventListener('keydown', e=>{ const k=e.key.toLowerCase(); if(phase==='await'&&(k===' '||k==='enter')){ begin(); return; } if(k==='c'){ camMode==='cinematic'?enterFree():enterCinematic(); } else if(k==='m'){ toggleMusic(); } else if(k==='r'){ recording?stopRec():startRec(); } else if(EMO_KEYS[k]){ playEmote(EMO_KEYS[k]); } });

// ---- Video export: open with ?record (4K) , or ?record=1440 / 1080 ; or press R to start/stop. Saves a .webm of one full journey ----
const REC = new URLSearchParams(location.search).has('record');
let mediaRec=null, recChunks=[], recording=false, recW=0, recH=0;
function startRec(){ if(recording||typeof MediaRecorder==='undefined') return; const p=new URLSearchParams(location.search).get('record'); recH=(p&&/^\d+$/.test(p))?+p:2160; recW=Math.round(recH*16/9);
  recording=true; renderer.setPixelRatio(1); renderer.setSize(recW,recH,false); camera.aspect=recW/recH; camera.updateProjectionMatrix();
  const cs=renderer.domElement.captureStream(60);
  if(audio){ try{ const d=audio.ctx.createMediaStreamDestination(); audio.master.connect(d); cs.addTrack(d.stream.getAudioTracks()[0]); }catch(e){} }
  let mime='video/webm;codecs=vp9,opus'; if(!MediaRecorder.isTypeSupported(mime)) mime='video/webm;codecs=vp8,opus'; if(!MediaRecorder.isTypeSupported(mime)) mime='video/webm';
  recChunks=[]; mediaRec=new MediaRecorder(cs,{mimeType:mime, videoBitsPerSecond: recH>=2000?48e6:recH>=1400?24e6:14e6});
  mediaRec.ondataavailable=e=>{ if(e.data&&e.data.size) recChunks.push(e.data); };
  mediaRec.onstop=()=>{ recDot(false); const W=innerWidth||1280, H=innerHeight||720; renderer.setPixelRatio(Math.min(devicePixelRatio,1.5)); renderer.setSize(W,H); camera.aspect=W/H; camera.updateProjectionMatrix(); const blob=new Blob(recChunks,{type:'video/webm'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='pippin-journey-'+recH+'p.webm'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),8000); };
  mediaRec.start(1000); recDot(true); }
function stopRec(){ if(!recording||!mediaRec) return; recording=false; try{ mediaRec.stop(); }catch(e){} }
function recDot(on){ let el=document.getElementById('recdot'); if(on&&!el){ el=document.createElement('div'); el.id='recdot'; el.style.cssText='position:fixed;top:10px;right:12px;z-index:9;color:#ff5a5a;font:600 12px system-ui;letter-spacing:1px'; el.textContent='● REC'; document.body.appendChild(el); } else if(!on&&el){ el.remove(); } }

// ---- The black-hole finale ----
function rugVisible(b){ rug.visible=b; underGlow.visible=b; for(const g of tassels) g.visible=b; }
function setMusic(padF,bp,oct){ if(!audio) return; audio.padF.frequency.value += (padF-audio.padF.frequency.value)*0.05; audio.bellProb=bp; audio.octave=oct; }
function resetAfterFinale(){ if(recording) stopRec(); inFinale=false; finT=0; journeyZ=0; looped=true; eyeClose=0; rider.visible=true; rider.scale.set(1,1,1); rider.position.set(0,0,0); rider.rotation.set(0,0,0); carpet.rotation.set(0,0,0); rugVisible(true); faceMat.uniforms.uOp.value=0; vortex.visible=false; barsEl().classList.remove('on'); moodEl().style.opacity='0'; curAct=-1; camInit=false; if(audio) audio.master.gain.linearRampToValueAtTime(musicOn?0.55:0,audio.ctx.currentTime+1); }
// finale camera: orbit around his current position. ang=0 behind (he faces the hole, +z), ang=π in front (his face)
function finOrbitCam(ang, dist, elev, dt){
  const fx=carpet.position.x, fy=carpet.position.y+1.6, fz=carpet.position.z;
  const ce=Math.cos(elev), se=Math.sin(elev);
  camTarget.set(fx+ce*Math.sin(ang)*dist, fy+se*dist, fz-ce*Math.cos(ang)*dist);
  camera.position.lerp(camTarget, 1-Math.pow(0.05,dt));
  camera.lookAt(fx,fy,fz);
  camera.fov += (42-camera.fov)*Math.min(1,dt*1.5); camera.updateProjectionMatrix();
}
function runFinale(dt){
  finT+=dt; const bh=blackHole.position;
  key.intensity=Math.max(key.intensity,3.2);
  const hov=[bh.x, bh.y+2, bh.z-26]; // hover point in front of the hole
  if(finT<3.0){ // APPROACH — glide to the hover point, camera behind
    carpet.position.lerp(camTarget.set(hov[0],hov[1],hov[2]), 0.05);
    carpet.rotation.set(lerp(carpet.rotation.x,0,0.08), lerp(carpet.rotation.y,0,0.08), lerp(carpet.rotation.z,0,0.08));
    rider.visible=true; rider.scale.set(1,1,1); rider.position.set(0,Math.sin(t*2)*0.03,0); rider.rotation.set(0,0,Math.sin(t*1.1)*0.025); eyeClose=0;
    finOrbitCam(0, 15, 0.18, dt);
    barsEl().classList.add('on'); moodEl().textContent='into the infinite'; moodEl().style.opacity='1'; fadeEl.style.opacity=0; setMusic(300,0.16,1);
  } else if(finT<9.0){ // PAN AROUND + CLOSE EYES — becoming one with the black hole
    const op=ss(0,1,(finT-3.0)/6.0);
    carpet.position.lerp(camTarget.set(hov[0],hov[1],hov[2]), 0.05); carpet.rotation.set(0,0,0);
    rider.visible=true; rider.scale.set(1,1,1); rider.position.set(0,Math.sin(t*1.6)*0.025,0);
    rider.rotation.set(-0.12*ss(0.2,1,op),0,Math.sin(t*0.9)*0.02);   // slight serene tilt up
    eyeClose=ss(0.1,0.7,op);                                          // eyes close as the camera swings to his face
    finOrbitCam(op*Math.PI*2, lerp(15,14,op), 0.16, dt);             // one slow revolution, ends behind
    barsEl().classList.add('on'); moodEl().textContent='into the infinite'; moodEl().style.opacity='1'; fadeEl.style.opacity=0; setMusic(lerp(300,240,op),0.12,1);
  } else if(finT<15.5){ // DESCEND & SHRINK — static shot; he sinks into the event horizon
    const p=ss(0,1,(finT-9.0)/6.5);
    eyeClose=1; carpet.rotation.set(0,0,0);
    carpet.position.set(lerp(hov[0],bh.x,p), lerp(hov[1],bh.y-1,p), lerp(hov[2],bh.z-3,p));  // glides from hover into the hole
    const S=lerp(1,0.04,Math.pow(p,1.25)); rider.visible=true; rider.scale.set(S,S,S); rider.position.set(0,Math.sin(t*1.4)*0.02,0); rider.rotation.set(0,0,0);
    camera.position.set(bh.x, bh.y+6, bh.z-40); camera.lookAt(bh.x, bh.y, bh.z-2); // fixed (static shot), behind — watching him sink into the hole
    camera.fov+=(40-camera.fov)*Math.min(1,dt*2); camera.updateProjectionMatrix();
    barsEl().classList.add('on'); moodEl().style.opacity='0'; setMusic(lerp(240,720,p),0.05,2);
  } else if(finT<17.0){ // THE VOID — he is gone; the hole turns
    rider.visible=false; rugVisible(false);
    camera.position.lerp(camTarget.set(bh.x, bh.y+1, bh.z-50), 0.05); camera.lookAt(bh.x, bh.y, bh.z);
    camera.fov+=(42-camera.fov)*Math.min(1,dt*2); camera.updateProjectionMatrix();
    fadeEl.style.opacity = ss(15.5,16.0,finT)*0.5*(1-ss(16.5,17.0,finT));
    if(audio) audio.master.gain.linearRampToValueAtTime(0.16, audio.ctx.currentTime+0.3); setMusic(640,0.04,2);
  } else if(finT<23.0){ // THE RETURN — his smiling face appears on the surface of the black hole
    rider.visible=false; rugVisible(false);
    const p=ss(0,1,(finT-17.0)/3.0); faceMat.uniforms.uOp.value=p;
    camera.position.lerp(camTarget.set(bh.x, bh.y+0.4, lerp(bh.z-66,bh.z-48,p)), 0.05); camera.lookAt(bh.x, bh.y, bh.z);
    camera.fov+=(40-camera.fov)*Math.min(1,dt*2); camera.updateProjectionMatrix();
    barsEl().classList.remove('on'); moodEl().style.opacity='0'; fadeEl.style.opacity=0;
    if(audio && finT<17.25) audio.master.gain.linearRampToValueAtTime(musicOn?0.6:0, audio.ctx.currentTime+2.6); setMusic(1500,0.7,2);
  } else { // fade to black → reborn at dawn
    faceMat.uniforms.uOp.value=1; fadeEl.style.opacity=ss(23.0,24.5,finT); if(finT>=24.7) resetAfterFinale();
  }
}

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05); t+=dt;
  if(phase==='flight' && !inFinale){ journeyZ+=dt*speedAt(journeyZ); if(journeyZ>=BH_Z){ journeyZ=BH_Z; inFinale=true; finT=0; } }
  const z=journeyZ, y=altitudeAt(z), x=lateralAt(z);

  // time of day
  const T=todAt(z);
  skyU.top.value.copy(T.top); skyU.mid.value.copy(T.mid); skyU.bot.value.copy(T.bot);
  scene.fog.color.copy(T.fog); scene.fog.density=T.fogD;
  key.color.copy(T.light); key.intensity=T.lightI; hemi.intensity=T.hemiI;
  sun.material.color.copy(T.sunCol); sunGlow.material.color.copy(T.sunCol);
  const sunDir=tmp.set(-0.35,T.sunElev,0.9).normalize(); sun.position.copy(sunDir).multiplyScalar(820); sunGlow.position.copy(sun.position);
  sun.scale.setScalar(T.sunSize); sunGlow.scale.setScalar(T.sunSize*2.4); sun.material.opacity=1; sun.visible=T.sunElev>-0.1;
  moon.visible=(T.night>0.4) && z<2160; moonGlow.material.opacity=(z<2160?T.night*0.6:0);
  const starF=Math.max(0,(T.night-0.25))*1.3; galaxy.material.opacity=starF; nebula.material.opacity=starF*0.75;
  // deep space objects (moon flyby, planets, galaxies, black hole)
  const inSpace = z>1900 || inFinale; spaceGroup.visible=inSpace;
  if(inSpace){ for(const p of planets){ p.rotation.y+=p.userData.spin*dt; const op=ss(p.position.z-560,p.position.z-180,z); for(const m of p.userData.mats) m[0].opacity=m[1]*op; } for(const g of galaxSpin) g.rotation.z+=g.userData.spin*dt; bhDisk.rotation.z+=dt*0.5; for(const o of spaceGroup.children){ if(o.userData.bb) o.quaternion.copy(camera.quaternion); }
    for(const a of asteroids){ a.rotation.x+=a.userData.rx*dt; a.rotation.y+=a.userData.ry*dt; a.position.x+=a.userData.drift*dt; }
    ufo.userData.t+=dt; const ut=ufo.userData.t; ufo.position.x=55+Math.sin(ut*0.13)*78; ufo.position.y=98+Math.sin(ut*0.5)*4; ufo.rotation.y+=dt*0.7; ufoLights.forEach((l,i)=>l.material.color.setHSL((ut*0.45+i*0.12)%1,0.9,0.6)); }

  // carpet placement + banking (skipped during the black-hole finale, which drives everything manually)
  if(!inFinale){
    carpet.position.set(x,y,z);
    const dz=2.0, xA=lateralAt(z+dz), yA=altitudeAt(z+dz);
    carpet.rotation.y=Math.atan2(xA-x,dz);
    carpet.rotation.z=THREE.MathUtils.clamp((x-xA)*0.5,-0.35,0.35)+Math.sin(t*0.7)*0.03;
    carpet.rotation.x=THREE.MathUtils.clamp((y-yA)*0.25,-0.25,0.25)-0.05+Math.sin(t*1.1)*0.02;
    carpet.position.y+=Math.sin(t*1.3)*0.25;
    updateRider(dt);
  }
  // apply eyelids every frame
  for(const l of eyelidMeshes) l.scale.setScalar(Math.max(0.0001, eyeClose*1.16));

  // carpet ripple + tassels
  for(let i=0;i<rugPos.count;i++){ const bx=rugBase[i*3], by=rugBase[i*3+1]; rugPos.setZ(i, Math.sin(by*1.5+t*3)*0.22+Math.sin(bx*2.2-t*2.2)*0.10+Math.sin((bx+by)*1.1+t*1.5)*0.06); }
  rugPos.needsUpdate=true; rugGeo.computeVertexNormals();
  tassels.forEach(g=>{ g.position.y=Math.sin(g.userData.edge*CD/2*1.5+t*3)*0.22+Math.sin(g.userData.x*2.2-t*2.2)*0.10; g.rotation.x=Math.sin(t*4+g.userData.phase)*0.25; g.rotation.z=Math.cos(t*3+g.userData.phase)*0.15; });

  // sparkles
  if(!inFinale){ emitAcc+=dt; while(emitAcc>0.018){ emitAcc-=0.018; emitSparkle(carpet.position.x,carpet.position.y,carpet.position.z); } }
  for(let i=0;i<SPN;i++){ if(spLife[i]<=0){ spCol[i*3]=spCol[i*3+1]=spCol[i*3+2]=0; continue; } spLife[i]-=dt; spPos[i*3]+=spVel[i*3]*dt; spPos[i*3+1]+=spVel[i*3+1]*dt; spPos[i*3+2]+=spVel[i*3+2]*dt; const f=Math.max(0,spLife[i]/spMax[i]); spCol[i*3]=spBase[i*3]*f; spCol[i*3+1]=spBase[i*3+1]*f; spCol[i*3+2]=spBase[i*3+2]*f; }
  spGeo.attributes.position.needsUpdate=true; spGeo.attributes.color.needsUpdate=true;

  // shooting stars (night + space) — and he notices them
  if(z>1850 || inFinale){ shootNext-=dt; if(shootNext<=0){ shootNext=rand(3.5,8); const s=shooters.find(o=>o.userData.life<=0); if(s){ const dir=tmp.set(rand(-1,1),-0.32,rand(-1,1)).normalize(); s.userData.vel.copy(dir).multiplyScalar(rand(45,72)); s.position.set(camera.position.x+rand(-70,70), camera.position.y+rand(26,56), camera.position.z+rand(-30,90)); s.quaternion.setFromUnitVectors(YAXIS,dir); s.userData.life=s.userData.max=rand(0.8,1.3); s.visible=true; if(!emName && !inFinale && camMode==='cinematic' && Math.random()<0.5) playEmote('gaze'); } } }
  for(const s of shooters){ if(s.userData.life>0){ s.userData.life-=dt; s.position.addScaledVector(s.userData.vel,dt); const o=Math.sin((s.userData.life/s.userData.max)*Math.PI); s.userData.tail.material.opacity=o*0.85; s.userData.head.material.opacity=o; if(s.userData.life<=0) s.visible=false; } }

  // birds flapping + circling
  for(const b of birds){ b.userData.ang+=b.userData.spd*dt; const c=b.userData.center, r=b.userData.rad; b.position.set(c.x+Math.cos(b.userData.ang)*r, c.y+Math.sin(t*0.6+b.userData.phase)*0.6, c.z+Math.sin(b.userData.ang)*r); b.rotation.y=-b.userData.ang+Math.PI/2*(b.userData.spd>0?1:-1); const fl=Math.sin(t*b.userData.flap+b.userData.phase)*0.6+0.15; b.userData.wings[0].rotation.z=fl; b.userData.wings[1].rotation.z=-fl; }

  // fish ripples + jumps (only when over lakes)
  for(const f of fishes){ f.userData.t-=dt; if(!f.userData.active && f.userData.t<=0 && Math.abs(z-920)<260){ const L=lakes[(Math.random()*lakes.length)|0]; const a=rand(0,6.28), rr=rand(0,L.r*0.7); f.userData.lake={x:L.x+Math.cos(a)*rr,z:L.z+Math.sin(a)*rr}; f.userData.active=true; f.userData.jt=0; f.visible=true; if(!emName && !inFinale && Math.random()<0.7) playEmote('peek'); } if(f.userData.active){ f.userData.jt+=dt; const p=f.userData.jt/1.0; const ly=Math.sin(p*Math.PI)*2.2; f.position.set(f.userData.lake.x,0.5+ly,f.userData.lake.z); f.rotation.x=-Math.cos(p*Math.PI)*1.2; if(p>=1){ f.userData.active=false; f.visible=false; f.userData.t=rand(3,9); spawnRipple(f.userData.lake.x,f.userData.lake.z); } } }
  if(Math.random()<dt*1.5 && Math.abs(z-920)<260){ const L=lakes[(Math.random()*lakes.length)|0]; const a=rand(0,6.28),rr=rand(0,L.r*0.8); spawnRipple(L.x+Math.cos(a)*rr,L.z+Math.sin(a)*rr); }
  for(const m of ripples){ if(m.userData.life>0){ m.userData.life-=dt; const p=1-m.userData.life/m.userData.max; m.scale.setScalar(1+p*8); m.material.opacity=(1-p)*0.5; if(m.userData.life<=0) m.visible=false; } }

  // precipitation: snow in the pass, rain over the forest
  const snowAmt=ss(1000,1040,z)*(1-ss(1150,1200,z));
  const rainAmt=ss(1210,1260,z)*(1-ss(1440,1500,z));
  updatePrecip(snow, snowAmt, dt); updatePrecip(rain, rainAmt, dt);
  // rainbow appears as the rain clears
  const rbAmt=ss(1420,1480,z)*(1-ss(1520,1580,z));
  rainbow.children.forEach(c=>c.material.opacity=rbAmt*0.5);

  // ---- camera director ----
  const heading=carpet.rotation.y;
  if(inFinale){ runFinale(dt); }
  else if(camMode==='free'){
    controls.target.lerp(tmp.copy(carpet.position).setY(carpet.position.y+2), 1-Math.pow(0.0008,dt));
    controls.update();
  } else { // steady follow — await / intro / flight
    let clTarget;
    if(phase==='await'){ clTarget=1; }                                   // start screen: on his face
    else if(phase==='intro'){ introT+=dt/5.0; clTarget=1-ss(0,1,introT); if(introT>=1) phase='flight'; } // pull back to begin
    else { clTarget=0.6*ss(2120,2185,z)*(1-ss(2255,2330,z)); }           // one subtle zoom as he enters space
    cl += (clTarget-cl)*Math.min(1,dt*0.9);
    updateOrbitCamera(dt);
  }

  // rigs follow
  skyRig.position.copy(camera.position);
  precipRig.position.copy(carpet.position);
  key.position.copy(carpet.position).addScaledVector(lightDir,90); key.target.position.copy(carpet.position);

  // act label (a small subtle emote on entering a new scene)
  let ai=0; for(let i=0;i<ACTS.length;i++) if(z>=ACTS[i].z) ai=i;
  if(phase==='flight' && ai!==curAct && !emName && !inFinale && Math.random()<0.5) playEmote('glance');
  setAct(ai);
  if(audio && !inFinale){ const M=MUSIC_MOOD[curAct]||MUSIC_MOOD[0]; audio.padF.frequency.value += (M[0]-audio.padF.frequency.value)*Math.min(1,dt*0.5); audio.bellProb=M[1]; audio.octave=M[2]; }
  if(!inFinale){ let fade=0; if(phase==='flight' && z<40 && looped) fade=1-ss(0,40,z); fadeEl.style.opacity=fade; }

  renderer.render(scene,camera);
}
function updatePrecip(sys, amt, dt){ sys.material.opacity=amt*(sys.userData.isSnow?0.95:0.7); if(amt<=0.001) return; const p=sys.geometry.attributes.position, v=sys.userData.vel, n=sys.userData.count; for(let i=0;i<n;i++){ p.array[i*3]+=v[i*3]*dt; p.array[i*3+1]+=v[i*3+1]*dt; p.array[i*3+2]+=v[i*3+2]*dt; if(p.array[i*3+1]<-20){ p.array[i*3]=rand(-26,26); p.array[i*3+1]=28+rand(0,6); p.array[i*3+2]=rand(-26,26); } else { if(p.array[i*3]>26)p.array[i*3]-=52; else if(p.array[i*3]<-26)p.array[i*3]+=52; if(p.array[i*3+2]>26)p.array[i*3+2]-=52; else if(p.array[i*3+2]<-26)p.array[i*3+2]+=52; } } p.needsUpdate=true; }
animate();
addEventListener('resize',()=>{ if(recording) return; camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
</script>
